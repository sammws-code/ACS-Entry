<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B454D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ACS Offline">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ACS Offline · بوابة ACS بدون إنترنت</title>
<style>
:root{
  --ink:#13262F; --muted:#586972; --paper:#F2F5F6; --card:#FFFFFF; --line:#D3DDE1; --line2:#E6ECEE;
  --teal:#0E5A64; --teal2:#E1EFF0; --teal3:#0B454D;
  --red:#B3263E; --red2:#FBE8EB; --amber:#8F5F00; --amber2:#FFF3D3; --green:#1B7A4E; --green2:#E2F3EA;
  --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.ar{font-weight:600}
.en{color:var(--muted);font-size:.86em;direction:ltr;unicode-bidi:embed}
.bi{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bi .en{margin-inline-start:auto;text-align:left}
.hide{display:none!important}
.muted{color:var(--muted)}

/* shell */
.top{background:var(--teal3);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25}
.brand b{font-size:1.05rem}
.brand span{font-size:.78rem;opacity:.8;direction:ltr;text-align:right}
.top .who{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:.88rem}
.top .who .role{background:rgba(255,255,255,.14);padding:2px 10px;border-radius:99px}
.nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 12px;overflow-x:auto;position:sticky;top:0;z-index:5}
.nav button{border:0;background:none;padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;line-height:1.25;white-space:nowrap;color:var(--muted)}
.nav button .en{font-size:.72rem}
.nav button.on{border-bottom-color:var(--teal);color:var(--teal3)}
.nav button:hover{background:var(--paper)}
main{max-width:1120px;margin:0 auto;padding:18px 14px 120px}
h2{margin:6px 0 14px;font-size:1.25rem}
h3{margin:0 0 10px;font-size:1.02rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grow{flex:1 1 200px}
.sp{height:8px}

/* buttons */
.btn{border:1px solid var(--teal);background:var(--teal);color:#fff;padding:9px 16px;border-radius:8px;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;line-height:1.25;min-height:42px;justify-content:center}
.btn .en{color:rgba(255,255,255,.8);font-size:.72rem}
.btn:hover{background:var(--teal3)}
.btn.alt{background:#fff;color:var(--teal3)}
.btn.alt .en{color:var(--muted)}
.btn.alt:hover{background:var(--teal2)}
.btn.danger{background:#fff;border-color:var(--red);color:var(--red)}
.btn.danger .en{color:var(--red);opacity:.8}
.btn.danger:hover{background:var(--red2)}
.btn.small{padding:5px 11px;min-height:34px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid #6FB4BC;outline-offset:2px}

/* inputs */
label.l{display:flex;flex-direction:column;gap:0;font-size:.92rem;margin-bottom:5px;line-height:1.3}
label.l .en{text-align:left;margin:0}
.dtrow{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
input[type=text],input[type=password],input[type=date],input[type=datetime-local],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid #B9C7CC;border-radius:8px;background:#fff;min-height:42px}
input[dir=ltr],.ltr{direction:ltr;text-align:left}
textarea{min-height:76px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:#EEF2F3;color:#6b7a81}

/* login */
.login{max-width:410px;margin:56px auto;padding:0 14px}
.login .card{padding:24px}
.err-box{background:var(--red2);border:1px solid #E7B2BB;color:#7D1327;padding:9px 12px;border-radius:8px;margin:10px 0}
.ok-box{background:var(--green2);border:1px solid #AAD7BF;color:#14573a;padding:9px 12px;border-radius:8px;margin:10px 0}
.warn-box{background:var(--amber2);border:1px solid #E8CF8C;color:#5f4000;padding:9px 12px;border-radius:8px;margin:10px 0}

/* hospital picker */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.hcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:6px;border-inline-start:5px solid var(--teal)}
.hcard:hover{background:var(--teal2)}
.hcard .nm{font-weight:700}
.hcard .cnt{display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem;margin-top:4px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;background:var(--paper);border:1px solid var(--line)}
.pill.d{background:var(--amber2);border-color:#E8CF8C;color:#5f4000}
.pill.s{background:var(--teal2);border-color:#B5D6D9;color:var(--teal3)}
.pill.v{background:var(--green2);border-color:#AAD7BF;color:#14573a}
.pill.x{background:var(--red2);border-color:#E7B2BB;color:#7D1327}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:start;white-space:nowrap}
th{background:#F5F8F9;font-weight:600;position:sticky;top:0}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--teal2)}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal}

/* form */
.fhead{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.15rem;font-weight:700;direction:ltr}
.snav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.snav a{padding:4px 11px;border:1px solid var(--line);border-radius:99px;font-size:.82rem;text-decoration:none;color:var(--ink);background:#fff}
.snav a:hover{background:var(--teal2)}
.sec{scroll-margin-top:62px}
.sec>h3{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--teal2);padding-bottom:8px;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px 18px}
.fld .hint{font-size:.78rem;color:var(--muted);margin-top:3px}
.fld .hint .en{display:block}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--red);background:#FFF8F9}
.fld .emsg{color:var(--red);font-size:.82rem;margin-top:4px}
.fld .emsg .en{color:var(--red);opacity:.85;display:block}
.fld.wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{border:1px solid #B9C7CC;border-radius:8px;padding:6px 12px;cursor:pointer;background:#fff;display:flex;flex-direction:column;align-items:center;line-height:1.25;min-height:42px;justify-content:center;min-width:64px}
.chips label .en{font-size:.7rem}
.chips label:hover{background:var(--teal2)}
.chips input:checked+label{background:var(--teal);border-color:var(--teal);color:#fff}
.chips input:checked+label .en{color:rgba(255,255,255,.82)}
.chips input:focus-visible+label{outline:3px solid #6FB4BC;outline-offset:2px}
.chips.dis label{opacity:.6;cursor:not-allowed}
.nrrow{display:flex;gap:8px;align-items:stretch}
.nrrow .u{align-self:center;color:var(--muted);font-size:.8rem;min-width:34px;direction:ltr}
.nrchk{display:flex;align-items:center;gap:5px;border:1px solid #B9C7CC;border-radius:8px;padding:0 10px;background:#fff;cursor:pointer;white-space:nowrap}
.nrchk input{width:auto;min-height:0}
.calc{background:var(--teal2);border-radius:var(--r);padding:12px;margin-top:16px}
.calc h4{margin:0 0 8px;font-size:.9rem;color:var(--teal3)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cv{background:#fff;border-radius:8px;padding:7px 10px}
.cv .k{font-size:.78rem;color:var(--muted)}
.cv .v{font-weight:700;font-size:1rem;direction:ltr;text-align:start}
.cv .v.yes{color:var(--red)} .cv .v.good{color:var(--green)} .cv .v.na{color:#8a979d;font-weight:400}

/* S-to-D gauge — the characteristic element */
.gauge{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:14px 0 4px}
.gauge .track{position:relative;height:16px;background:linear-gradient(90deg,#E1EFF0 0 50%,#F8DDE2 50% 100%);border-radius:99px;margin:22px 4px 26px;direction:ltr}
.gauge .fill{position:absolute;left:0;top:0;height:100%;border-radius:99px;background:var(--teal);transition:width .25s}
.gauge .fill.late{background:var(--red)}
.gauge .tick{position:absolute;top:-6px;width:2px;height:28px;background:var(--ink)}
.gauge .tl{position:absolute;top:26px;transform:translateX(-50%);font-size:.72rem;color:var(--muted)}
.gauge .tl.tt{top:-22px}
.gauge .read{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline}
.gauge .big{font-size:1.15rem;font-weight:700;direction:ltr}

.foot{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);padding:9px 14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;z-index:6}
.badge{padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600}
.badge.Draft{background:var(--amber2);color:#5f4000}.badge.Submitted{background:var(--teal2);color:var(--teal3)}.badge.Verified{background:var(--green2);color:#14573a}.badge.Excluded{background:var(--red2);color:#7D1327}.badge.Test{background:#ECE8F6;color:#4A3A86}

/* modal + toast */
.mback{position:fixed;inset:0;background:rgba(19,38,47,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.modal h3{margin-top:0}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.rlist label{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer}
.rlist label:hover{background:var(--paper)}
.rlist input{width:auto;min-height:0;margin-top:5px}
#toast{position:fixed;top:14px;inset-inline:0;display:flex;justify-content:center;pointer-events:none;z-index:30}
#toast div{background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;max-width:90%;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#toast div.bad{background:var(--red)}

/* dashboard */
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.fbox{flex:1 1 150px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:#fff}
.fbox .n{font-size:1.5rem;font-weight:700;direction:ltr;text-align:start}
.fbox.k{border-top:4px solid var(--teal)} .fbox.x{border-top:4px solid var(--red)} .fbox.g{border-top:4px solid var(--green)}
.pbar{height:14px;background:var(--line2);border-radius:99px;overflow:hidden;direction:ltr}
.pbar i{display:block;height:100%;background:var(--teal)}
.al{padding:8px 12px;border-radius:8px;margin-bottom:6px;border:1px solid var(--line)}
.al.warn{background:var(--amber2);border-color:#E8CF8C}.al.ok{background:var(--green2);border-color:#AAD7BF}.al.info{background:#fff}
.heat0{background:#fff}.heat1{background:#FFF3D3}.heat2{background:#FBD9A8}.heat3{background:#F6B3B3}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs2 button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;cursor:pointer}
.tabs2 button.on{background:var(--teal);color:#fff;border-color:var(--teal)}

/* guide */
.guide h3{margin-top:4px}
.guide p{margin:6px 0}
.guide .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0}
.guide .pair>div:last-child{direction:ltr;color:#33454d;border-inline-start:1px solid var(--line);padding-inline-start:14px}
.guide ul{margin:6px 0;padding-inline-start:20px}
.gtool{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;position:sticky;top:0;z-index:5;background:var(--paper);padding:6px 0}
.gedit{outline:2px dashed var(--line);outline-offset:6px;min-height:300px;border-radius:6px}
.gedit:focus{outline-color:var(--teal2)}
@media(max-width:760px){.guide .pair{grid-template-columns:1fr}.guide .pair>div:last-child{border:0;padding:0;border-top:1px dashed var(--line);padding-top:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

p.muted>.ar,p.muted>.en{display:block}

body{padding-top:env(safe-area-inset-top)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<div id="modal-root"></div>
<script>
var ACS_OFFLINE = true;
/* ======================================================================
   ACS PORTAL — SHARED SCHEMA + LOGIC
   Identical code runs on the server (Code.gs) and in the browser (Index.html).
   Single source of truth: fields, options, calculated variables, validation.
   ====================================================================== */
var ACS_SCHEMA_VERSION = '1.6';
var ACS_YEARS = [2020, 2021, 2022, 2023, 2024, 2025, 2026];
var ACS_DEFAULT_YEAR = 2026;
var ACS_LVEF_ALERT_PCT = 20;
/* Pre-specified NR rule for covariates of the primary models (protocol v5.7, Step 5): above MID the multiple-imputation result is reported with equal prominence; above HIGH the variable leaves the primary model */
var ACS_NR_MID_PCT = 10, ACS_NR_HIGH_PCT = 40;
/* Variables that decide whether a record is Complete: everything the primary models and the outcome need (descriptive fields such as peak troponin, CK-MB or treatments do not) */
var ACS_CORE_KEYS = ['age_years', 'sex', 'residence', 'dm', 'htn', 'dyslipidemia', 'acs_type', 'referral_source', 'prior_cad_mi', 'ckd', 'killip_class', 'echo_done', 'in_hospital_death', 'cardiogenic_shock', 'vt_vf', 'heart_failure', 'icu_admission', 'discharge_status'];
var ACS_STATUSES = ['Draft', 'Submitted', 'Verified', 'Excluded', 'Test'];

function _o(v, ar) { return { v: v, ar: ar }; }
var _YN = [_o('Yes', 'نعم'), _o('No', 'لا')];
var _YNNR = [_o('Yes', 'نعم'), _o('No', 'لا'), _o('NR', 'غير مسجل')];
var _NR = _o('NR', 'غير مسجل');

var ACS_SECTIONS = [
  { id: 'id',   en: 'Admission', ar: 'الدخول' },
  { id: 'demo', en: 'Demographics', ar: 'البيانات الديموغرافية' },
  { id: 'time', en: 'Timing & presentation', ar: 'التوقيت والتقديم' },
  { id: 'risk', en: 'Risk factors', ar: 'عوامل الخطورة' },
  { id: 'dx',   en: 'Diagnosis & severity', ar: 'التشخيص والشدة' },
  { id: 'tx',   en: 'Treatment', ar: 'العلاج' },
  { id: 'out',  en: 'In-hospital outcomes', ar: 'النتائج داخل المشفى' }
];

var ACS_GOVERNORATES = ['Damascus', 'Rural Damascus', 'Homs', 'Hama', 'Aleppo', 'Idlib', 'Latakia', 'Tartus',
  'Deir ez-Zor', 'Raqqa', 'Hasakah', 'Daraa', 'Suwayda', 'Quneitra'];
var ACS_GOV_AR = { 'Damascus': 'دمشق', 'Rural Damascus': 'ريف دمشق', 'Homs': 'حمص', 'Hama': 'حماة', 'Aleppo': 'حلب',
  'Idlib': 'إدلب', 'Latakia': 'اللاذقية', 'Tartus': 'طرطوس', 'Deir ez-Zor': 'دير الزور', 'Raqqa': 'الرقة',
  'Hasakah': 'الحسكة', 'Daraa': 'درعا', 'Suwayda': 'السويداء', 'Quneitra': 'القنيطرة' };

var ACS_EXCL_REASONS = [
  { v: 'Age <18', ar: 'العمر أقل من ١٨ سنة' },
  { v: 'ACS not confirmed per criteria', ar: 'تشخيص ACS غير مؤكد وفق المعايير' },
  { v: 'Admitted outside study period', ar: 'دخول خارج فترة الدراسة' },
  { v: 'Transferred from another hospital', ar: 'محوَّل من مشفى آخر' },
  { v: 'End-stage renal disease on dialysis', ar: 'فشل كلوي نهائي على الغسيل' },
  { v: 'Active malignancy', ar: 'ورم خبيث فعّال' },
  { v: 'Pre-existing NYHA class IV heart failure', ar: 'قصور قلب NYHA IV سابق' },
  { v: 'Silent MI found incidentally', ar: 'احتشاء صامت مكتشف بالصدفة' },
  { v: 'Incomplete record (ACS type / timing / outcomes missing)', ar: 'سجل ناقص (نوع ACS أو وقت الوصول أو النتائج)' },
  { v: 'Duplicate (chart already entered)', ar: 'تكرار (الإضبارة مُدخلة سابقاً)' },
  { v: 'Other', ar: 'سبب آخر' }
];

function _f(k, s, t, en, ar, x) {
  var f = { k: k, s: s, t: t, en: en, ar: ar };
  if (x) { for (var p in x) { if (Object.prototype.hasOwnProperty.call(x, p)) f[p] = x[p]; } }
  return f;
}
function _rule(en, ar) { return { en: en, ar: ar }; }

var _DOCQ = [_o('Exact time documented', 'الوقت موثق بدقة'), _o('Approximate time documented', 'الوقت موثق تقريباً'),
  _o('Patient unable to specify', 'المريض غير قادر على التحديد'), _NR];
var _TIMECAT = [_o('<3h', '<3 س'), _o('3-6h', '3-6 س'), _o('6-12h', '6-12 س'), _o('12-24h', '12-24 س'), _o('>24h', '>24 س')];
var _TOD = [_o('Daytime (8AM-12AM)', 'نهار (8ص-12م)'), _o('Nighttime (12AM-8AM)', 'ليل (12م-8ص)')];

var ACS_FIELDS = [
  /* ---------- Admission ---------- */
  _f('admission_date', 'id', 'date', 'Admission date', 'تاريخ الدخول'),
  _f('discharge_date', 'id', 'date', 'Discharge / death date', 'تاريخ الخروج أو الوفاة'),
  _f('admission_year', 'id', 'calc', 'Year of admission', 'سنة الدخول',
    { rule: _rule('Year part of the admission date.', 'سنة تاريخ الدخول.') }),
  _f('los_days', 'id', 'calc', 'Length of stay (days)', 'مدة الإقامة (أيام)',
    { rule: _rule('Discharge/death date minus admission date, in calendar days (same day = 0).', 'تاريخ الخروج ناقص تاريخ الدخول بالأيام (نفس اليوم = 0).') }),

  /* ---------- Demographics ---------- */
  _f('age_years', 'demo', 'int', 'Age (years)', 'العمر (سنة)', { min: 18, max: 110, unit: 'yrs', hint: { en: 'Adults ≥18 only.', ar: 'البالغون ≥١٨ سنة فقط.' }, irr: true }),
  _f('sex', 'demo', 'sel', 'Sex', 'الجنس', { opts: [_o('Male', 'ذكر'), _o('Female', 'أنثى')] }),
  _f('residence', 'demo', 'sel', 'Residence', 'منطقة السكن', { opts: [_o('Urban', 'حضري'), _o('Rural', 'ريفي'), _NR], hint: { en: 'From the address in the medical record.', ar: 'من العنوان المسجل في الملف.' } }),
  _f('governorate', 'demo', 'sel', 'Governorate of residence', 'محافظة السكن',
    { opts: ACS_GOVERNORATES.map(function (g) { return _o(g, ACS_GOV_AR[g]); }).concat([_o('Outside Syria', 'خارج سوريا'), _NR]) }),
  _f('education', 'demo', 'sel', 'Education', 'المستوى التعليمي',
    { opts: [_o('Illiterate', 'أمي'), _o('Primary', 'ابتدائي'), _o('Secondary', 'ثانوي'), _o('University', 'جامعي'), _NR],
      hint: { en: 'Record the 4 levels exactly as in the chart. Most charts do not record education: choose NR then — never guess or infer it from the job or the address. Education is NOT in the primary Regression 1 (protocol v5.7); it is reported descriptively and used only in a restricted exploratory analysis.', ar: 'سجّل المستوى بالمستويات الأربعة كما في الملف. أغلب الإضابير لا تذكر التعليم: اختر NR حينها — لا تخمّن ولا تستنتجه من المهنة أو العنوان. التعليم ليس في الانحدار ١ الأساسي (البروتوكول v5.7)؛ يُعرض وصفياً ويُستخدم فقط في تحليل استكشافي مقيَّد.' } }),

/* strip invisible bidi/zero-width marks, NBSP and edge spaces that Android keyboards / WhatsApp copy-paste add */
function cleanCred(v) { return String(v || '').replace(/[\u200B-\u200F\u202A-\u202E\u2060-\u2069\uFEFF\u00A0]/g, '').trim(); }
function doLogin() {
  var u = cleanCred($('lu').value), p = cleanCred($('lp').value);

  $('lbtn').disabled = true;
  api('login', { username: u, password: p }).then(function (r) {
    S.token = r.token; S.user = r.user; S.mustChange = r.mustChange; saveSess();

function afterLogin() {

}
function doChangePw() {

  api('changePassword', { oldPassword: a, newPassword: b }).then(function () { S.mustChange = false; saveSess(); return afterLogin(); })
    .catch(function (e) { $('pwerr').innerHTML = '<div class="err-box">' + esc(e.msg || 'Error') + '</div>'; });
}
function doLogout() { api('logout').catch(function () { }); ssDel('acs_sess'); S.token = null; S.user = null; S.boot = null; S.form = null; S.hosp = null; S.list = null; render(); }

/* ======================================================================

function emptyVals() { var v = {}; ACS_FIELDS.forEach(function (f) { if (f.t !== 'calc') v[f.k] = ''; }); return v; }
function openRecord(code) {
  vapi('getRecord', { hospital: S.hosp, code: code }).then(function (rec) {
    var vals = emptyVals();
    ACS_FIELDS.forEach(function (f) {
      if (f.t === 'calc') return;
      var x = rec[f.k]; x = (x === undefined || x === null || x === 'NA') ? '' : String(x);
      if (f.t === 'dt' && x) x = x.replace(' ', 'T');
      vals[f.k] = x;
    });
    var yr = acsParseDate(vals.admission_date) !== null ? new Date(acsParseDate(vals.admission_date)).getUTCFullYear() : S.year;
    var ro = rec.status === 'Excluded' || rec.status === 'Test' || (rec.status === 'Verified' && !isAdmin()) || !canEnter();
    S.form = { hosp: S.hosp, code: code, status: rec.status, year: yr, vals: vals, errs: {}, dirty: false, ro: ro, irr: false, flags: rec.qc_flags || '', exclReason: rec.exclusion_reason || '', secs: 0, total: Number(rec.entry_seconds) || 0, ver: 0 };
    S.tab = 'collect'; renderForm();
  }).catch(fail);
}

function hintHtml(f) { return f.hint ? '<div class="hint">' + esc(f.hint.ar) + '<span class="en">' + esc(f.hint.en) + '</span></div>' : ''; }

  }

    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();

  } catch (e) { toast('المتصفح منع التنزيل · Download blocked by the browser', true); }
}

function download(name, csv, plain) {

    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();

var G_TAGS = 'H1 H2 H3 H4 P DIV SPAN B STRONG I EM U BR HR UL OL LI A TABLE THEAD TBODY TR TH TD SMALL SUB SUP BLOCKQUOTE'.split(' ');
var G_DROP = 'SCRIPT STYLE IFRAME OBJECT EMBED LINK META FORM INPUT BUTTON TEXTAREA SELECT SVG MATH IMG VIDEO AUDIO'.split(' ');
function sanitizeGuide(html) {
  var doc = new DOMParser().parseFromString('<body>' + String(html || '') + '</body>', 'text/html');
  (function walk(node) {
    Array.prototype.slice.call(node.childNodes).forEach(function (c) {
      if (c.nodeType === 8) { node.removeChild(c); return; }
      if (c.nodeType !== 1) return;
      if (G_DROP.indexOf(c.tagName) >= 0) { node.removeChild(c); return; }
      walk(c);
      if (G_TAGS.indexOf(c.tagName) < 0) { while (c.firstChild) node.insertBefore(c.firstChild, c); node.removeChild(c); return; }
      Array.prototype.slice.call(c.attributes).forEach(function (a) {
        var n = a.name.toLowerCase();
        if (n === 'class' || n === 'dir' || n === 'colspan' || n === 'rowspan') return;
        if (n === 'href' && c.tagName === 'A' && /^(https?:|mailto:)/i.test(a.value.trim())) return;
        c.removeAttribute(a.name);
      });
      if (c.tagName === 'A') { c.setAttribute('target', '_blank'); c.setAttribute('rel', 'noopener noreferrer'); }
    });
  })(doc.body);
  return doc.body.innerHTML;
}

    pair('<ul><li><b>التأخر:</b> أكثر من 12 ساعة بين بدء الأعراض والوصول إلى الإسعاف (S-to-D). 12 ساعة بالضبط = مبكر. يُحلَّل أيضاً كمتغير متصل.</li><li><b>ACS:</b> STEMI (ارتفاع ST + تروبونين إيجابي)، NSTEMI (دون ارتفاع ST مستمر + تروبونين إيجابي)، UA (دون ارتفاع ST مستمر + تروبونين سلبي). إذا لم توجد نتيجة تروبونين بالإضبارة سجّل NR: يُقبل STEMI (تشخيص بالتخطيط)، أما NSTEMI وUA فتُستبعد الإضبارة (ACS غير مؤكد).</li><li><b>Killip:</b> I لا قصور · II خراخر أو S3 · III وذمة رئة · IV صدمة قلبية.</li><li><b>LVEF:</b> ≥50% محفوظة · 40–49% منخفضة قليلاً · &lt;40% منخفضة.</li><li><b>MAHCE (النقطة الأساسية):</b> نعم إذا حدث أي مما يلي: وفاة داخل المشفى، صدمة قلبية، VT/VF مستمر، قصور قلب حديث، عناية مركزة، أو LVEF &lt;40%.</li><li><b>NR:</b> غير مسجل في الإضبارة — <u>لا تخمّن ولا تقدّر أبداً</u>.</li></ul>',
      '<ul><li><b>Delay:</b> &gt;12 h from symptom onset to ED arrival (S-to-D); exactly 12 h = early. Also analysed as continuous.</li><li><b>ACS:</b> STEMI (ST elevation + troponin+), NSTEMI (no persistent ST elevation + troponin+), UA (no persistent ST elevation + troponin−). If the chart has no troponin result record NR: STEMI is accepted (ECG diagnosis); NSTEMI/UA are excluded (ACS not confirmed).</li><li><b>Killip:</b> I no HF · II rales/S3 · III pulmonary edema · IV cardiogenic shock.</li><li><b>LVEF:</b> ≥50% preserved · 40–49% mildly reduced · &lt;40% reduced.</li><li><b>MAHCE (primary):</b> yes if any of in-hospital death, cardiogenic shock, sustained VT/VF, new heart failure, ICU admission, or LVEF &lt;40%.</li><li><b>NR:</b> not recorded in the chart — <u>never guess or estimate</u>.</li></ul>') + '</div>' +
    '<div class="card"><h3>' + bi('٣. معايير الشمول والاستبعاد', '3. Eligibility') + '</h3>' +
    pair('<p><b>الشمول:</b> بالغ ≥١٨ سنة · ACS مؤكد حسب ACC/AHA 2025 · دخول ضمن فترة الدراسة · وقت بدء الأعراض موثق (دقيق أو تقريبي) لتحليل التأخر — والإضبارة بلا وقت بدء <b>لا تُستبعد</b>: تُدخَل كاملة (جودة التوثيق «المريض غير قادر على التحديد» أو NR) وتُقارَن بالمحلَّلين.</p><p><b>الاستبعاد:</b> سجل ناقص (نوع ACS أو وقت الوصول أو النتائج) · NSTEMI أو UA بلا نتيجة تروبونين (ACS غير مؤكد) · محوَّل من مشفى آخر · فشل كلوي نهائي على الغسيل · ورم خبيث فعّال · قصور قلب NYHA IV سابق · احتشاء صامت مكتشف بالصدفة.</p>',
      '<p><b>Include:</b> adult ≥18 · confirmed ACS (ACC/AHA 2025) · admitted in the study period · symptom-onset time documented (exact or approximate) for the delay analyses — a chart without onset time is <b>not excluded</b>: enter it completely (documentation quality “unable to specify” or NR); it is compared with the analysed patients.</p><p><b>Exclude:</b> incomplete record (ACS type, ED arrival time or outcomes missing) · NSTEMI/UA with no troponin result (ACS not confirmed) · transferred from another hospital · ESRD on dialysis · active malignancy · pre-existing NYHA IV heart failure · silent MI found incidentally.</p>') + '</div>' +
    '<div class="card"><h3>' + bi('٤. خطوات العمل', '4. How to collect') + '</h3>' +
    pair('<ol><li>اختر <b>المشفى</b> أولاً (كل مشفى بياناته منفصلة)، ثم اختر <b>سنة الدخول</b>.</li><li>اضغط <b>إضبارة جديدة</b> وافرز الإضبارة: مؤهلة أم مستبعدة؟ الاستبعاد يُسجَّل بسببه فقط بلا بيانات سريرية.</li><li>للمؤهلة يُنشأ <b>كود</b> تلقائي (مثل MUJ-0001). دوّنه بجانب رقم الإضبارة في <u>سجلّك الورقي المحلي فقط</u>. (بوضع الأوفلاين يكون الكود <b>مؤقتاً</b> TMP-… فدوّنه أيضاً، وبعد المزامنة اكتب الكود الرسمي بجانبه.)</li><li>أدخل البيانات حسب الأقسام السبعة. استخدم <b>حفظ كمسودة</b> متى شئت، و<b>تسليم</b> عند الاكتمال.</li><li>التنبيهات الصفراء (مثل STEMI مع تروبونين سلبي) تحتاج تأكيدك بعد مراجعة الإضبارة؛ تُحفظ مع السجل.</li><li>المشرف يتحقق من السجلات ويقفلها (<b>Verified</b>). لا شيء يُحذف نهائياً؛ التعديلات مسجلة. الإضبارة التجريبية تُعلَّم بزر «تجربة» فتخرج من كل الإحصاءات.</li></ol>',
      '<ol><li>Choose the <b>hospital</b> first (each hospital has its own dataset), then the <b>admission year</b>.</li><li>Press <b>New chart</b> and screen it: eligible or excluded? Exclusions are logged with their reason only — no clinical data.</li><li>Eligible charts get an automatic <b>code</b> (e.g. MUJ-0001). Note it next to the file number in <u>your local paper log only</u>. (Offline the code is <b>temporary</b>, TMP-…: note it too, and after syncing write the official code beside it.)</li><li>Enter data section by section. <b>Save draft</b> any time; <b>Submit</b> when complete.</li><li>Yellow warnings (e.g. STEMI with negative troponin) need your confirmation after re-checking the chart; they are stored with the record.</li><li>The admin verifies and locks records (<b>Verified</b>). Nothing is permanently deleted; every change is logged. A practice chart is marked with the Test button and drops out of every statistic.</li></ol>') + '</div>' +
    '<div class="card"><h3>' + bi('٥. قواعد الإدخال', '5. Entry rules') + '</h3>' +
    pair('<ul><li><b>الأرقام بالإنكليزية فقط (0-9).</b> إذا كتبت أرقاماً عربية تُحوَّل تلقائياً. الحسابات تعتمد عليها. لا فاصلة ولا فاصل آلاف: اكتب 1200 وليس 1,200، والنقطة للكسور العشرية (55.5).</li><li>كل الحقول إلزامية: أدخل القيمة أو اختر <b>NR</b> إن لم تكن مسجلة. لا تترك فراغاً.</li><li>التعليم والوظيفة نادراً ما يُسجَّلان في الإضابير: اختر <b>NR</b> ولا تخمّن؛ وهما ليسا في النموذج الأساسي (يُعرضان وصفياً وفي تحليل استكشافي).</li><li>الحقول المرتبطة بشرط (مثل زمن البالون) تظهر وتختفي تلقائياً وتُخزَّن <b>N/A</b> إن لم تنطبق.</li><li>الوقت بنظام 24 ساعة كما في الإضبارة. إذا كان وقت البدء غير موثق اختر جودة التوثيق المناسبة؛ يُترك S-to-D فارغاً ويُستثنى السجل من تحليل التأخر.</li><li>لا تكتب أسماء أو أرقام هواتف أو أرقام هوية في الملاحظات — الموقع يرفضها.</li><li><b>الحفظ التلقائي:</b> المسودة تُحفظ تلقائياً أثناء الكتابة، فإذا تركتها وعدت لها لاحقاً تجد ما أدخلته؛ تكمل أو تضغط <b>تصفير الإضبارة</b> لتبدأ من الصفر (يطلب تأكيداً).</li><li><b>المعلومة غير الموجودة بالإضبارة لا تُعبَّأ ولا تُقدَّر:</b> سجّلها NR. يُصنِّف الموقع السجل تلقائياً «مكتمل» أو «غير مكتمل» بحسب متغيرات التحليل فقط؛ ويُعرض عدد وأسماء كل حقول NR للمتابعة.</li></ul>',
      '<ul><li><b>English digits only (0-9).</b> Arabic digits are converted automatically; calculations depend on them. No commas or thousands separators: type 1200, not 1,200; use a dot for decimals (55.5).</li><li>Every field is required: enter the value or choose <b>NR</b> if not recorded. Never leave blanks.</li><li>Education and occupation are rarely recorded in charts: choose <b>NR</b>, never guess; they are not in the primary model (reported descriptively and in an exploratory analysis).</li><li>Conditional fields (e.g. door-to-balloon) appear/disappear automatically and are stored as <b>N/A</b> when not applicable.</li><li>Use 24-hour time as in the chart. If onset time is not documented choose the right documentation quality; S-to-D stays empty and the record is left out of the delay analysis.</li><li>Never type names, phone numbers or ID numbers in notes — the site rejects them.</li><li><b>Autosave:</b> a draft is saved automatically while you type, so if you leave and come back later your entries are there; continue, or press <b>Reset chart</b> to start from zero (it asks for confirmation).</li><li><b>Information missing from the chart is never filled in or estimated:</b> record it as NR. The site automatically classifies the record as Complete or Incomplete based on the variables used in the analyses only; the number and names of all NR fields are shown for monitoring.</li></ul>') + '</div>' +
    '<div class="card"><h3>' + bi('٦. المتغيرات المحسوبة تلقائياً', '6. Automatically calculated variables') + '</h3><div class="tw"><table><thead><tr><th>' + bi('المتغير', 'Variable') + '</th><th>' + bi('القاعدة', 'Rule') + '</th></tr></thead><tbody>' + calcRows + '</tbody></table></div></div>' +
    '<div class="card"><h3>' + bi('٧. الخصوصية والجودة', '7. Privacy & quality') + '</h3>' +
    pair('<ul><li>لا تُخزَّن أي معرّفات مباشرة: لا اسم، ولا تاريخ ميلاد، ولا رقم إضبارة، ولا هاتف. المريض يُعرَّف بكود فقط.</li><li>الاتصال مشفّر (HTTPS) والتخزين مشفّر لدى Google؛ الوصول بحسابات شخصية مع قفل بعد محاولات فاشلة، وتُسجَّل كل العمليات.</li><li>جمع متتابع (consecutive) لكل الإضابير المؤهلة لتقليل التحيز، مع مخطط STROBE تلقائي.</li><li>10–15% من الإضابير (10 على الأقل لكل مشفى) تُراجَع بشكل مستقل من مُدخِل ثانٍ (Kappa / ICC).</li><li>التصدير للمشاركة العامة مجهّل بلا تواريخ، تماشياً مع سياسات إتاحة البيانات في المجلات.</li><li>يُسجَّل وقت الإدخال الفعلي لكل مستخدم (دون محتوى ما كُتب) لمتابعة الجودة؛ وقت الخمول لا يُحسب.</li></ul>',
      '<ul><li>No direct identifiers are stored — no name, date of birth, file number or phone. Patients are identified by code only.</li><li>Connection is encrypted (HTTPS) and storage is encrypted by Google; personal accounts, lock-out after failed attempts, and every action is logged.</li><li>Consecutive screening of all eligible charts to limit selection bias, with an automatic STROBE flow.</li><li>10–15% of charts (at least 10 per hospital) are independently re-abstracted by a second collector (Kappa / ICC).</li><li>The public export is de-identified with no dates, in line with journal data-availability policies.</li><li>Active entry time is recorded per user (not what was typed) for quality monitoring; idle time is not counted.</li></ul>') +
    (cfg.contact ? '<p><b>' + 'للتواصل · Contact:' + '</b> ' + esc(cfg.contact) + '</p>' : '') + '</div>';
  if (tokens) out = out.replace(/<div class="tw"><table>[\s\S]*?<\/table><\/div>/, '<p>{{calc_table}}</p>');
  return out;
}

/* ======================================================================
   ACS PORTAL — OFFLINE LAYER (PWA)
   Reuses the exact same form engine (client.js) and logic (shared.js);
   only the "server" is replaced by an encrypted on-device store.
   ====================================================================== */
var ACS_SERVER_URL_DEFAULT = '';
var LB = { key: null, hasSetup: false, unlocked: false, boot: null, items: {}, counters: {}, synced: [], lastSync: '', url: '', srvToken: null, busy: false };

/* ---------- small helpers ---------- */

}
function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
function nowStr() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }

/* ---------- IndexedDB ---------- */
function idb() {

    var r = indexedDB.open('acs_offline', 1);
    r.onupgradeneeded = function () { var d = r.result; d.createObjectStore('kv'); d.createObjectStore('items', { keyPath: 'uuid' }); };
    r.onsuccess = function () { res(r.result); };

}
function idbOp(store, mode, fn) {

}
function kvGet(k) { return idbOp('kv', 'readonly', function (s) { return s.get(k); }); }

/* ---------- AES-GCM with a passphrase-derived key ---------- */
var OFF_ITER = 600000;   /* PBKDF2 iterations for NEW activations; each device stores its own count ('iter'); devices activated before this change keep 200000 */
function deriveKey(pass, saltB64, iter) {
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']).then(function (base) {
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(saltB64), iterations: iter || 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

    return { iv: b64e(iv), ct: b64e(new Uint8Array(ct)) };

}

}
function persistItem(it) { return encJson(LB.key, it).then(function (e) { return itemPutRaw({ uuid: it.uuid, iv: e.iv, ct: e.ct }); }); }

/* ---------- unlock / lock ---------- */
function applyUnlocked() {
  LB.unlocked = true; S.token = 'offline';
  var u = LB.boot.user;
  S.user = { username: u.username, name: u.name, role: 'Collector', hospitals: u.hospitals };
  S.boot = { user: S.user, hospitals: [], config: LB.boot.config, years: LB.boot.years, defaultYear: LB.boot.defaultYear };
  S.mustChange = false;
}
function offUnlock(pass) {

    .then(function (key) {
      return decJson(key, chk).then(function () { LB.key = key; }, function () { throw new Error('bad'); });
    })
    .then(function () { return kvGet('boot'); }).then(function (b) { return decJson(LB.key, b); }).then(function (b) { LB.boot = b; return kvGet('state'); })
    .then(function (st) { return st ? decJson(LB.key, st) : { counters: {}, synced: [], lastSync: '' }; })
    .then(function (st) { LB.counters = st.counters || {}; LB.synced = st.synced || []; LB.lastSync = st.lastSync || ''; return itemsAll(); })
    .then(function (rows) {
      LB.items = {};
      return rows.reduce(function (p, r) { return p.then(function () { return decJson(LB.key, r).then(function (it) { LB.items[it.uuid] = it; }); }); }, Promise.resolve());
    }).then(applyUnlocked);
}
function localAutosave() {
  var F = S.form;
  if (!F || F.irr || F.ro || !F.dirty || !LB.unlocked) return Promise.resolve();
  var it = findItem(F.hosp, F.code);
  if (!it) return Promise.resolve();
  var a = acsApply(F.vals);
  it.vals = a; it.secs = (it.secs || 0) + (F.secs || 0); F.secs = 0; it.updatedAt = nowStr();
  return persistItem(it);
}
function offlineLock() {
  localAutosave().catch(function () { }).then(function () {
    LB.key = null; LB.items = {}; LB.unlocked = false; LB.boot = null; LB.srvToken = null;
    S.token = null; S.user = null; S.boot = null; S.form = null; S.hosp = null; S.list = null; S.mustChange = false;
    render();
  });
}
setInterval(function () { if (LB.unlocked && Date.now() - S.lastAct > IDLE_LOCK_MS) offlineLock(); }, 15000);

function loginHtml(msg) { return LB.hasSetup ? unlockHtml(msg) : setupHtml(msg); }

function offSetup() {

    .then(function () { applyUnlocked(); S.lastAct = Date.now(); if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); render(); });

/* ---------- talking to the real portal (only used for activation + sync) ---------- */
function srvPost(action, token, payload) {
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var to = setTimeout(function () { if (ctl) ctl.abort(); }, 60000);
  return fetch(LB.url || lsGet('acs_srv'), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, token: token, payload: payload || {} }), redirect: 'follow', signal: ctl ? ctl.signal : undefined })
    .then(function (r) { clearTimeout(to); return r.json(); })
    .then(function (j) { if (!j.ok) throw { code: j.code, msg: j.msg }; return j.data; })
    .catch(function (e) { clearTimeout(to); if (e && e.code) throw e; throw { code: 'NET', msg: 'تعذّر الاتصال بالبوابة · Could not reach the portal' }; });
}

/* ---------- the local "backend": same actions the form UI already uses ---------- */
function findItem(hosp, code) {
  var ks = Object.keys(LB.items);
  for (var i = 0; i < ks.length; i++) { var it = LB.items[ks[i]]; if (it.kind === 'record' && it.hospital === hosp && it.tempCode === code) return it; }
  return null;
}
function lerr(code, msg) { return { code: code, msg: msg }; }
function localDo(action, p) {
  var it, ks;
  switch (action) {
    case 'bootstrap': {
      var hs = LB.boot.hospitals.map(function (h) {
        var c = { total: 0, Draft: 0, Submitted: 0, Verified: 0, Excluded: 0, Test: 0 };
        Object.keys(LB.items).forEach(function (k) { var x = LB.items[k]; if (x.kind === 'record' && x.hospital === h.code && x.status !== 'Test') { c.total++; c[x.status] = (c[x.status] || 0) + 1; } });
        return { code: h.code, name_en: h.name_en, name_ar: h.name_ar, city: h.city, note: h.note, counts: c };
      });
      S.boot.hospitals = hs;
      return Promise.resolve({ user: S.user, hospitals: hs, config: LB.boot.config, years: LB.boot.years, defaultYear: LB.boot.defaultYear });
    }
    case 'screen': {
      var h = LB.boot.hospitals.filter(function (x) { return x.code === p.hospital; })[0];
      if (!h) return Promise.reject(lerr('FORBIDDEN', 'No access to this hospital.'));
      if (ACS_YEARS.indexOf(Number(p.year)) < 0) return Promise.reject(lerr('BAD', 'Invalid year.'));
      var base = { uuid: uuid4(), hospital: h.code, year: Number(p.year), createdAt: nowStr(), updatedAt: nowStr(), secs: 0, ack: false };
      if (p.outcome === 'Included') {
        var n = (LB.counters[h.code] || 0) + 1; LB.counters[h.code] = n;
        it = Object.assign(base, { kind: 'record', tempCode: 'TMP-' + h.code + '-' + (n < 1000 ? ('000' + n).slice(-3) : String(n)), status: 'Draft', vals: {}, qc: '', exclReason: '' });
        LB.items[it.uuid] = it;
        return persistItem(it).then(saveState).then(function () { return { screen_id: it.uuid, patient_code: it.tempCode }; });
      }
      if (!ACS_EXCL_REASONS.some(function (r) { return r.v === p.reason; })) return Promise.reject(lerr('BAD', 'Choose an exclusion reason.'));
      it = Object.assign(base, { kind: 'screenExcluded', reason: p.reason });
      LB.items[it.uuid] = it;
      return persistItem(it).then(function () { return { screen_id: it.uuid, patient_code: '' }; });
    }
    case 'records': {
      var rows = [];
      Object.keys(LB.items).forEach(function (k) {
        var x = LB.items[k]; if (x.kind !== 'record' || x.hospital !== p.hospital) return;
        var v = x.vals || {};
        rows.push({ patient_code: x.tempCode, status: x.status, admission_date: v.admission_date || '', age_years: v.age_years || '', sex: v.sex || '', acs_type: v.acs_type || '', stod_hours: v.stod_hours === undefined ? '' : v.stod_hours, delayed_12h: v.delayed_12h || '', flags: x.qc ? x.qc.split(';').filter(String).length : 0, updated_at: x.updatedAt, irr: false, completeness: v.completeness || '', nr_count: v.nr_count === undefined ? '' : v.nr_count, _t: x.createdAt });
      });

      return Promise.resolve(rows);
    }
    case 'getRecord': {
      it = findItem(p.hospital, p.code);
      if (!it) return Promise.reject(lerr('NOT_FOUND', 'Record not found.'));
      var o = {};
      ACS_FIELDS.forEach(function (f) { if (f.t !== 'calc') o[f.k] = it.vals && it.vals[f.k] !== undefined ? it.vals[f.k] : ''; });
      o.status = it.status; o.qc_flags = it.qc || ''; o.exclusion_reason = it.exclReason || ''; o.entry_seconds = it.secs || 0; o.patient_code = it.tempCode;
      return Promise.resolve(o);
    }
    case 'save': {
      it = findItem(p.hospital, p.code);
      if (!it) return Promise.reject(lerr('NOT_FOUND', 'Record not found.'));
      if (it.status === 'Excluded') return Promise.reject(lerr('LOCKED', 'This chart is excluded.'));
      if (it.status === 'Test') return Promise.reject(lerr('LOCKED', 'This chart is marked Test.'));
      var mode = p.mode === 'submit' ? 'submit' : 'draft';
      var res = acsValidate(p.values || {}, { mode: mode, year: Number(p.year) || null });
      if (res.errors.length) return Promise.resolve({ saved: false, errors: res.errors, warnings: res.warnings });
      if (mode === 'submit' && res.warnings.length && !p.ack) return Promise.resolve({ saved: false, needAck: true, warnings: res.warnings });
      it.vals = res.values; it.qc = res.warnings.map(function (w) { return w.c; }).join(';');
      if (mode === 'submit') it.status = 'Submitted';
      it.ack = !!p.ack || !res.warnings.length;   /* re-evaluated on every save: a confirmation never carries over to new warnings */
      it.secs = (it.secs || 0) + Math.max(0, Math.min(3600, Math.round(Number(p.secs) || 0)));
      it.updatedAt = nowStr(); it.lastError = '';
      return persistItem(it).then(function () { return { saved: true, status: it.status, warnings: res.warnings, completeness: res.values.completeness, nr_count: res.values.nr_count, nr_fields: res.values.nr_fields }; });
    }
    case 'exclude': {
      it = findItem(p.hospital, p.code);
      if (!it) return Promise.reject(lerr('NOT_FOUND', 'Record not found.'));
      if (!ACS_EXCL_REASONS.some(function (r) { return r.v === p.reason; })) return Promise.reject(lerr('BAD', 'Choose an exclusion reason.'));

      if (it.status !== 'Test') return Promise.reject(lerr('BAD_STATE', 'Only a Test chart can be restored offline.'));
      it.status = 'Draft'; it.updatedAt = nowStr();
      return persistItem(it).then(function () { return { status: 'Draft' }; });
    }
    case 'reset': {
      it = findItem(p.hospital, p.code);
      if (!it) return Promise.reject(lerr('NOT_FOUND', 'Record not found.'));

    case 'irrGet': return Promise.resolve({});

  }
}
function localCall(action, token, p) {
  if (!LB.unlocked && action !== 'logout') return Promise.resolve({ ok: false, code: 'AUTH', msg: 'التطبيق مقفل · App is locked' });
  return Promise.resolve().then(function () { return localDo(action, p || {}); })
    .then(function (d) { return { ok: true, data: d }; }, function (e) { return { ok: false, code: (e && e.code) || 'ERR', msg: (e && (e.msg || e.message)) || String(e) }; });
}

/* ---------- daily-sync discipline: banner + soft block on NEW charts ---------- */

  return { warn: c.sync_warn_hours === undefined ? 24 : Number(c.sync_warn_hours), block: c.sync_block_hours === undefined ? 72 : Number(c.sync_block_hours), pending: c.sync_block_pending === undefined ? 100 : Number(c.sync_block_pending) };
}
function syncState() {
  var items = pendingList(), cfg = syncCfg(), n = items.length, oldest = null;
  items.forEach(function (x) { var t = new Date(String(x.createdAt).replace(' ', 'T')).getTime(); if (!isNaN(t) && (oldest === null || t < oldest)) oldest = t; });
  var ageH = oldest === null ? 0 : (Date.now() - oldest) / 3600000;
  var byAge = cfg.block > 0 && n > 0 && ageH >= cfg.block, byCount = cfg.pending > 0 && n >= cfg.pending;
  return { n: n, ageH: ageH, warn: cfg.warn > 0 && n > 0 && ageH >= cfg.warn, block: byAge || byCount, byAge: byAge, byCount: byCount, cfg: cfg };
}
function syncBlocked() { return LB.unlocked && syncState().block; }
function fmtAge(h) { return h < 1 ? 'أقل من ساعة · under 1 h' : h < 48 ? Math.floor(h) + ' ساعة · ' + Math.floor(h) + ' h' : Math.floor(h / 24) + ' يوم · ' + Math.floor(h / 24) + ' days'; }
function updateSyncBanner() {
  var el = $('syncbar'); if (!el) return;
  if (!LB.unlocked) { el.innerHTML = ''; return; }
  var st = syncState();
  if (!st.n) { el.innerHTML = ''; return; }
  var cls = st.block ? 'err-box' : st.warn ? 'warn-box' : 'ok-box';
  var msg = st.block
    ? bi('إضافة إضبارة جديدة موقوفة حتى تزامن (' + st.n + ' بانتظار الرفع، أقدمها منذ ' + fmtAge(st.ageH).split(' · ')[0] + ').', 'New charts are blocked until you sync (' + st.n + ' waiting, oldest ' + fmtAge(st.ageH).split(' · ')[1] + ').')
    : st.warn
      ? bi('زامن اليوم: ' + st.n + ' إضبارة بانتظار الرفع، أقدمها منذ ' + fmtAge(st.ageH).split(' · ')[0] + '.', 'Sync today: ' + st.n + ' waiting, oldest ' + fmtAge(st.ageH).split(' · ')[1] + '.')
      : bi(st.n + ' إضبارة بانتظار المزامنة.', st.n + ' waiting to sync.');
  el.innerHTML = '<div class="' + cls + '" style="margin:0;border-radius:0;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap"><div>' + msg + '</div>' +
    '<button class="btn alt small" data-act="gosync">' + bi('إلى المزامنة', 'Go to Sync') + '</button></div>';
}
function syncBlockModal() {
  var st = syncState(), online = navigator.onLine;
  modal('<h3>' + bi('زامن أولاً', 'Sync first') + '</h3><div class="err-box" style="margin-top:0">' +
    bi(st.byCount ? 'تراكم ' + st.n + ' إضبارة غير مرفوعة (الحد ' + st.cfg.pending + ').' : 'مرّ أكثر من ' + st.cfg.block + ' ساعة على أقدم إضبارة غير مرفوعة.', st.byCount ? st.n + ' charts are waiting (limit ' + st.cfg.pending + ').' : 'The oldest unsynced chart is older than ' + st.cfg.block + ' hours.') + '</div>' +
    '<p class="muted">' + bi('السبب: الإضابير غير المرفوعة موجودة على هذا الجهاز فقط، وضياعه يعني ضياعها. يمكنك متابعة تعديل المسودات الحالية.', 'Why: unsynced charts exist on this device only — losing it means losing them. You can still edit existing drafts.') + '</p>' +
    (online ? '' : '<div class="warn-box">' + bi('لا يوجد إنترنت الآن — أعد المحاولة عند توفره.', 'No internet right now — try again when you are online.') + '</div>') +
    '<div class="acts"><button class="btn alt" data-act="closem">' + bi('إغلاق', 'Close') + '</button><button class="btn" data-act="gosync">' + bi('إلى المزامنة', 'Go to Sync') + '</button></div>');
}

/* ---------- sync tab ---------- */
function pendingList() {
  return Object.keys(LB.items).map(function (k) { return LB.items[k]; }).sort(function (a, b) { return a.createdAt < b.createdAt ? -1 : 1; });
}
function updateNet() { var n = $('net'); if (n) n.textContent = navigator.onLine ? 'متصل · online' : 'بدون إنترنت · offline'; }
window.addEventListener('online', function () { updateNet(); });
window.addEventListener('offline', function () { updateNet(); });
setInterval(function () { updateNet(); updateSyncBanner(); }, 3000);

function viewSync() {
  var items = pendingList(), n = items.length, online = navigator.onLine;
  var rec = items.filter(function (x) { return x.kind === 'record'; }), sx = items.filter(function (x) { return x.kind === 'screenExcluded'; });
  var url = LB.url || lsGet('acs_srv');
  $('view').innerHTML = '<h2>' + bi('المزامنة مع البوابة', 'Sync with the portal') + '</h2>' +
    '<div class="card"><div class="flow">' + fbox('k', rec.length, 'إضابير بانتظار الرفع', 'Charts waiting') + fbox('x', sx.length, 'استبعاد عند الفرز بانتظار الرفع', 'Screen-exclusions waiting') +
    fbox(online ? 'g' : 'x', online ? '✓' : '✗', online ? 'متصل بالإنترنت' : 'لا يوجد إنترنت', online ? 'Online' : 'Offline') + '</div>' +
    '<p class="muted" style="margin:10px 0 0">' + (LB.lastSync ? bi('آخر مزامنة: ' + LB.lastSync, 'Last sync: ' + LB.lastSync) : bi('لم تتم مزامنة بعد.', 'No sync yet.')) + '</p></div>' +
    '<div class="card"><h3>' + bi('رفع البيانات', 'Upload data') + '</h3><div id="sres"></div>' +
    (LB.srvToken ? '' : '<div class="row"><div class="grow"><label class="l">' + bi('كلمة مرور البوابة (للمزامنة)', 'Portal password (for syncing)') + '</label><input id="spw" type="password" dir="ltr" autocomplete="off"></div></div><div class="sp"></div>') +
    '<div class="row"><button class="btn" data-act="dosync" ' + (online && n ? '' : 'disabled') + '>' + bi('مزامنة الآن', 'Sync now') + '</button>' +
    '<button class="btn alt" data-act="refreshh" ' + (online ? '' : 'disabled') + '>' + bi('تحديث قائمة المشافي', 'Refresh hospital list') + '</button></div>' +
    '<p class="muted" style="margin-bottom:0">' + bi('بعد نجاح المزامنة تُحذف الإضبارة من هذا الجهاز ويظهر كودها الرسمي أدناه — دوّنه في سجلك الورقي.', 'After a successful sync the chart is removed from this device and its official code is listed below — write it in your paper log.') + '</p></div>' +
    (n ? '<div class="tw"><table><thead><tr><th>' + bi('الكود المؤقت', 'Temp code') + '</th><th>' + bi('المشفى', 'Hospital') + '</th><th>' + bi('الحالة', 'Status') + '</th><th>' + bi('آخر تعديل', 'Updated') + '</th><th>' + bi('ملاحظة', 'Note') + '</th></tr></thead><tbody>' +
      items.map(function (x) {
        return '<tr><td class="code" style="font-size:.9rem">' + esc(x.kind === 'record' ? x.tempCode : 'screening') + '</td><td>' + esc(x.hospital) + '</td><td>' + (x.kind === 'record' ? '<span class="badge ' + x.status + '">' + x.status + '</span>' : '<span class="badge Excluded">Excluded at screening</span>') + '</td><td dir="ltr">' + esc(x.updatedAt) + '</td><td class="wrap" style="max-width:320px;color:var(--red)">' + esc(x.lastError || '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="card muted">' + bi('لا توجد بيانات بانتظار الرفع.', 'Nothing is waiting to be uploaded.') + '</div>') +
    '<div class="card" style="margin-top:14px"><h3>' + bi('الأكواد الرسمية بعد المزامنة', 'Official codes after sync') + '</h3>' +
    (LB.synced.length ? '<div class="tw"><table><thead><tr><th>' + bi('الكود المؤقت', 'Temp code') + '</th><th>' + bi('الكود الرسمي', 'Official code') + '</th><th>' + bi('المشفى', 'Hospital') + '</th><th>' + bi('التاريخ', 'Date') + '</th></tr></thead><tbody>' +
      LB.synced.slice().reverse().map(function (m) { return '<tr><td class="code" style="font-size:.9rem">' + esc(m.temp) + '</td><td class="code" style="font-size:.9rem"><b>' + esc(m.code) + '</b></td><td>' + esc(m.hospital) + '</td><td dir="ltr">' + esc(m.at) + '</td></tr>'; }).join('') + '</tbody></table></div><div class="sp"></div><button class="btn alt small" data-act="clearmap">' + bi('مسحت الأكواد من هنا (دوّنتها)', 'Clear this list (I have noted the codes)') + '</button>' : '<span class="muted">—</span>') +
    '</div><p class="muted" style="font-size:.8rem;direction:ltr">Portal: ' + esc(url || '—') + '</p>';
  updateNet(); updateSyncBanner();
}
function itemPayload(it) {
  if (it.kind === 'screenExcluded') return { uuid: it.uuid, hospital: it.hospital, year: it.year, outcome: 'Excluded', reason: it.reason, savedAt: it.updatedAt };
  return { uuid: it.uuid, hospital: it.hospital, year: it.year, outcome: 'Included', mode: it.status === 'Submitted' ? 'submit' : 'draft', values: it.status === 'Test' ? {} : (it.vals || {}), ack: !!it.ack, secs: it.secs || 0, savedAt: it.updatedAt, finalStatus: it.status === 'Excluded' ? 'Excluded' : (it.status === 'Test' ? 'Test' : ''), excludeReason: it.exclReason || '' };
}
function errSummary(r) {
  if (r.needAck) return 'تحتاج تأكيد التنبيهات · needs warning confirmation — open the portal online';
  var es = (r.errors || []).slice(0, 3).map(function (e) { return e.k + ': ' + e.en; });
  return es.join(' | ') || 'rejected';
}
function doSync() {
  if (LB.busy) return;
  var items = pendingList();
  if (!items.length) return;
  if (!navigator.onLine) { toast('لا يوجد إنترنت · No internet', true); return; }
  LB.busy = true;
  var login = LB.srvToken ? Promise.resolve() : (function () {
    var pw = cleanCred(($('spw') || {}).value);
    if (!pw) return Promise.reject({ msg: 'أدخل كلمة مرور البوابة · Enter the portal password' });
    return srvPost('login', null, { username: LB.boot.user.username, password: pw }).then(function (r) {
      if (r.mustChange) throw { msg: 'غيّر كلمة المرور المؤقتة من البوابة أولاً · Change your temporary password on the portal first' };
      LB.srvToken = r.token;
    });
  })();
  var ok = 0, bad = 0, stop = null;
  login.then(function () {
    return items.reduce(function (chain, it) {
      return chain.then(function () {
        if (stop) return;
        return srvPost('syncOffline', LB.srvToken, { item: itemPayload(it) }).then(function (r) {
          if (r.synced) {
            ok++;
            if (it.kind === 'record') LB.synced.push({ temp: it.tempCode, code: r.patient_code, hospital: it.hospital, at: nowStr() });
            delete LB.items[it.uuid];
            return itemDel(it.uuid);
          }
          bad++; it.lastError = errSummary(r); return persistItem(it);
        }, function (e) {
          if (e && (e.code === 'NET' || e.code === 'AUTH')) { stop = e; if (e.code === 'AUTH') LB.srvToken = null; return; }
          bad++; it.lastError = (e && e.msg) || 'error'; return persistItem(it);
        });
      });
    }, Promise.resolve());
  }).then(function () { LB.lastSync = nowStr(); return saveState(); })
    .then(function () { return stop ? null : silentRefresh(); })
    .then(function () {
      LB.busy = false; viewSync();
      var msg = '<div class="' + (bad || stop ? 'warn-box' : 'ok-box') + '">' + 'تم رفع ' + ok + ' · uploaded ' + ok + (bad ? ' — ' + bad + ' مرفوضة · rejected (see notes)' : '') + (stop ? '<br>' + esc(stop.msg || 'توقفت المزامنة · sync stopped') : '') + '</div>';
      var el = $('sres'); if (el) el.innerHTML = msg;
    })
    .catch(function (e) {
      LB.busy = false; viewSync();
      var el = $('sres'); if (el) el.innerHTML = '<div class="err-box">' + esc((e && (e.msg || e.message)) || 'Error') + '</div>';
    });
}
function silentRefresh() {
  if (!LB.srvToken) return Promise.resolve();
  return srvPost('bootstrap', LB.srvToken, {}).then(function (b) {
    LB.boot.hospitals = b.hospitals.map(function (h) { return { code: h.code, name_en: h.name_en, name_ar: h.name_ar, city: h.city, note: h.note }; });
    LB.boot.config = b.config; LB.boot.user = b.user; LB.boot.fetchedAt = nowStr();
    return encJson(LB.key, LB.boot).then(function (e) { return kvPut('boot', e); });
  }).catch(function () { });
}
function refreshHospitals() {
  if (!LB.srvToken) { toast('سجّل دخولك بكلمة مرور البوابة أولاً عبر «مزامنة الآن» · Sign in via “Sync now” first', true); return; }
  srvPost('bootstrap', LB.srvToken, {}).then(function (b) {
    LB.boot.hospitals = b.hospitals.map(function (h) { return { code: h.code, name_en: h.name_en, name_ar: h.name_ar, city: h.city, note: h.note }; });
    LB.boot.config = b.config; LB.boot.user = b.user; LB.boot.fetchedAt = nowStr();
    return encJson(LB.key, LB.boot).then(function (e) { return kvPut('boot', e); });
  }).then(function () { toast('حُدّثت قائمة المشافي · Hospital list updated ✓'); }).catch(function (e) { toast(esc((e && e.msg) || 'Error'), true); });
}
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act]'); if (!t) return;
  var a = t.getAttribute('data-act');
  if (a === 'dosync') doSync();
  else if (a === 'refreshh') refreshHospitals();
  else if (a === 'clearmap') { LB.synced = []; saveState().then(viewSync); }
  else if (a === 'gosync') { closeModal(); if (leaveForm()) { S.form = null; showTab('sync'); } }
});

/* ---------- boot ---------- */
function ACS_BOOT() {
  kvGet('salt').then(function (s) { LB.hasSetup = !!s; LB.url = lsGet('acs_srv') || ACS_SERVER_URL_DEFAULT; render(); }).catch(function () { render('التخزين المحلي غير متاح في هذا المتصفح · Local storage is unavailable in this browser'); });
}

ACS_BOOT();
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
